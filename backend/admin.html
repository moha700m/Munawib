<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>مِناوب — لوحة الإدارة</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<style>
:root{--p:#13827a;--pl:#1a998f;--navy:#0f2a3d;--bg:#f2f7f7;--card:#fff;--t:#11212d;--m:#64748b;--b:#e2e8f0}
@media(prefers-color-scheme:dark){:root{--bg:#0d1417;--card:#16212a;--t:#e7eef2;--m:#94a3b8;--b:#24323d}}
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,"SF Arabic","Segoe UI",Tahoma,sans-serif;background:var(--bg);color:var(--t)}
header{background:var(--navy);color:#fff;padding:12px 16px;display:flex;gap:10px;align-items:center;position:sticky;top:0;z-index:5}
header b{font-size:20px}.badge{background:var(--p);padding:3px 10px;border-radius:99px;font-size:12px}
nav{display:flex;gap:6px;overflow:auto;padding:10px 12px;background:var(--card);border-bottom:1px solid var(--b);position:sticky;top:52px;z-index:4}
nav button{white-space:nowrap}main{max-width:1200px;margin:auto;padding:16px}
.card{background:var(--card);border:1px solid var(--b);border-radius:18px;padding:16px;margin-bottom:14px}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
button,.btn{background:var(--p);color:#fff;border:0;border-radius:12px;padding:10px 14px;font:inherit;cursor:pointer}
button.o{background:transparent;color:var(--p);border:1px solid var(--p)}button.r{background:#dc2626}button:disabled{opacity:.5}
input,select,textarea{font:inherit;padding:10px;border-radius:12px;border:1px solid var(--b);background:var(--bg);color:var(--t);width:100%}
label{display:block;font-size:13px;color:var(--m);margin:8px 0 4px}table{width:100%;border-collapse:collapse}td,th{padding:8px;border-bottom:1px solid var(--b);text-align:right;font-size:14px}
.stat b{font-size:28px;display:block;color:var(--p)}.muted{color:var(--m);font-size:13px}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:end}.row>*{flex:1;min-width:140px}
.rg{overflow:auto}.rg table td,.rg table th{padding:2px;text-align:center;min-width:34px}.rg td.n{text-align:right;min-width:140px;white-space:nowrap}
.c{width:32px;height:32px;border-radius:8px;border:0;font-weight:700;padding:0;color:#fff}.cD{background:#2563eb}.cN{background:#7c3aed}.cR{background:#94a3b8}.cL{background:#f97316}.cC{background:#db2777}.c_{background:var(--b);color:var(--m)}
.pill{padding:2px 8px;border-radius:99px;font-size:12px;background:#fef3c7;color:#92400e}.pill.approved{background:#dcfce7;color:#166534}.pill.rejected{background:#fee2e2;color:#991b1b}
#toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;padding:10px 16px;border-radius:12px;display:none;z-index:9}
.hide{display:none}code{background:var(--bg);padding:2px 6px;border-radius:6px}
</style></head><body>
<header><b>مِناوب</b><span class="muted" style="color:#9fb">لوحة الإدارة</span><span style="flex:1"></span><span id="who"></span><span id="role" class="badge"></span><button class="o" id="logout" style="color:#fff;border-color:#fff">خروج</button></header>
<nav id="nav" class="hide"></nav>
<main id="app"></main><div id="toast"></div>
<script>
const API=location.origin;let T=localStorage.tok||'',B=null,view='dash',month=new Date();
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const toast=m=>{const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(t._);t._=setTimeout(()=>t.style.display='none',3500)};
async function api(m,p,b){const r=await fetch(API+p,{method:m,headers:{'content-type':'application/json',...(T?{authorization:'Bearer '+T}:{})},body:b?JSON.stringify(b):undefined});const j=await r.json().catch(()=>({}));if(!r.ok){if(r.status===401&&p!=='/auth/login'){logout()}throw new Error(j.error||r.status)}return j}
const ROLE={admin:'مدير',head_nurse:'رئيسة تمريض',supervisor:'مشرف',employee:'موظف'};
const me=()=>B?.me,isAdmin=()=>me()?.role==='admin',isHead=()=>['admin','head_nurse'].includes(me()?.role),isMgr=()=>['admin','head_nurse','supervisor'].includes(me()?.role);
const dn=id=>B.departments.find(d=>d.id===id)?.name||'',un=id=>B.users.find(u=>u.id===id)?.name||'—';
function logout(){T='';localStorage.removeItem('tok');B=null;render()}
$('#logout').onclick=logout;
async function load(){B=await api('GET','/bootstrap');if(!B.me)return;try{B.super=await api('GET','/super/hospitals')}catch{B.super=null}}
function navs(){const v=[['dash','الرئيسية'],['roster','الجدول'],['staff','الموظفون',isMgr()],['req','الموافقات'],['ann','الإعلانات'],['push','تنبيه مخصص',isHead()],['hours','الساعات والتقارير'],['events','الدورات'],['cov','التغطية',isHead()],['depts','الأقسام',isAdmin()],['audit','سجل التدقيق',isHead()],['notif','سجل التنبيهات'],['info','بيانات المستشفى',isHead()],['super','كل المستشفيات',!!B.super]].filter(x=>x[2]!==false);
 $('#nav').innerHTML=v.map(([k,t])=>`<button class="${view===k?'':'o'}" onclick="go('${k}')">${t}</button>`).join('')}
window.go=k=>{view=k;render()};
async function render(){const a=$('#app');$('#nav').classList.toggle('hide',!T);$('#logout').classList.toggle('hide',!T);
 if(!T){$('#who').textContent='';$('#role').textContent='';return authView(a)}
 if(!B){a.innerHTML='<div class="card">جارِ التحميل…</div>';try{await load()}catch(e){a.innerHTML=`<div class="card">${esc(e.message)}</div>`;return}}
 $('#who').textContent=me().name;$('#role').textContent=ROLE[me().role];navs();
 try{a.innerHTML=(V[view]||V.dash)();(A[view]||(()=>{}))()}catch(e){a.innerHTML=`<div class="card">${esc(e.message)}</div>`}}
async function refresh(){B=null;await render()}
async function act(f,msg){try{const r=await f();if(msg)toast(typeof msg==='function'?msg(r):msg);await refresh();return r}catch(e){toast('خطأ: '+e.message)}}
// ---------- auth ----------
function authView(a){a.innerHTML=`<div class="card" style="max-width:460px;margin:30px auto"><h2>تسجيل الدخول</h2>
<div class="row"><button id="m1">بالرقم الوظيفي</button><button class="o" id="m2">بالبريد</button><button class="o" id="m3">تسجيل مستشفى</button><button class="o" id="m4">انضمام بدعوة</button></div><div id="f"></div><p id="err" style="color:#dc2626"></p></div>`;
 const forms={m1:`<label>رمز المستشفى</label><input id="hc" value="${esc(localStorage.hc||'')}" dir="ltr"><label>الرقم الوظيفي</label><input id="en" inputmode="numeric" dir="ltr"><label>كلمة المرور</label><input id="pw" type="password"><br><br><button id="go">دخول</button>`,
 m2:`<label>البريد</label><input id="em" type="email" dir="ltr"><label>كلمة المرور</label><input id="pw" type="password"><br><br><button id="go">دخول</button>`,
 m3:`<label>اسم المستشفى</label><input id="h"><label>القسم الأول</label><input id="d" value="الطوارئ"><label>اسمك</label><input id="n"><label>رقمك الوظيفي (اختياري)</label><input id="an" inputmode="numeric" dir="ltr"><label>البريد</label><input id="em" type="email" dir="ltr"><label>كلمة المرور (8+)</label><input id="pw" type="password"><label>رئيسة التمريض (اختياري)</label><div class="row"><input id="hn" placeholder="الاسم"><input id="hnn" placeholder="الرقم الوظيفي" inputmode="numeric"></div><br><button id="go">إنشاء</button>`,
 m4:`<label>رمز الدعوة</label><input id="code" dir="ltr"><label>البريد (اختياري)</label><input id="em" type="email" dir="ltr"><label>كلمة المرور (8+)</label><input id="pw" type="password"><br><br><button id="go">انضمام</button>`};
 const set=k=>{['m1','m2','m3','m4'].forEach(x=>$('#'+x).className=x===k?'':'o');$('#f').innerHTML=forms[k];$('#go').onclick=()=>submit(k)};
 ['m1','m2','m3','m4'].forEach(k=>$('#'+k).onclick=()=>set(k));set('m1');
 async function submit(k){const v=id=>($('#'+id)?.value||'').trim();try{let r;
  if(k==='m1'){localStorage.hc=v('hc').toUpperCase();r=await api('POST','/auth/login',{hospital_code:v('hc').toUpperCase(),employee_number:v('en'),password:$('#pw').value})}
  if(k==='m2')r=await api('POST','/auth/login',{email:v('em'),password:$('#pw').value});
  if(k==='m3'){r=await api('POST','/auth/signup',{hospital:v('h'),department:v('d'),name:v('n'),email:v('em'),password:$('#pw').value,...(v('an')?{employee_number:v('an')}:{}),...(v('hn')?{head_nurse:{name:v('hn'),employee_number:v('hnn')}}:{})});T=r.token;localStorage.tok=T;view='info';created=true;await refresh();return}
  if(k==='m4')r=await api('POST','/auth/join',{code:v('code').toUpperCase(),email:v('em')||undefined,password:$('#pw').value});
  T=r.token;localStorage.tok=T;view='dash';await refresh()}catch(e){$('#err').textContent=e.message}}}
// ---------- views ----------
const ym=()=>[month.getFullYear(),month.getMonth()+1],dim=()=>new Date(month.getFullYear(),month.getMonth()+1,0).getDate();
const myDept=()=>B._dept||me().department_id||B.departments[0]?.id;
const deptSel=()=>isAdmin()?`<select onchange="B._dept=this.value;render()">${B.departments.map(d=>`<option value="${d.id}" ${d.id===myDept()?'selected':''}>${esc(d.name)}</option>`).join('')}</select>`:`<b>${esc(dn(myDept()))}</b>`;
const staff=()=>B.users.filter(u=>u.department_id===myDept());
const roster=()=>{const[y,m]=ym();return B.rosters.find(r=>r.department_id===myDept()&&r.year===y&&r.month===m)};
const today=()=>new Date().toISOString().slice(0,10);
function cov(r,d){let D=0,N=0;for(const u of staff()){const c=r?.grid?.[u.id]?.[d];if(c==='D')D++;if(c==='N')N++}return{D,N}}
let created=false;
function infoText(){const L=['بيانات الدخول إلى مِناوب','المستشفى: '+(B.hospital?.name||'')];if(B.hospital?.code)L.push('رمز المستشفى: '+B.hospital.code);const m=me();L.push(ROLE[m.role]+': '+m.name+(m.employee_number?' — الرقم الوظيفي '+m.employee_number:'')+(m.email?' — '+m.email:''));
 for(const u of B.users.filter(u=>u.role==='head_nurse'&&u.id!==m.id))L.push('رئيسة التمريض: '+u.name+(u.employee_number?' — الرقم الوظيفي '+u.employee_number:'')+(u.invite_code?' — كود التفعيل '+u.invite_code:' — مفعّل'));
 L.push('طريقة الدخول: افتح مِناوب ← أدخل الرقم الوظيفي ورمز المستشفى وكلمة المرور. أول مرة: «تفعيل حساب بدعوة».');return L.join('\n')}
window.cp=(t,b)=>{navigator.clipboard.writeText(t).then(()=>{toast('تم النسخ');if(b){const o=b.textContent;b.textContent='✓ تم النسخ';setTimeout(()=>b.textContent=o,1500)}navigator.vibrate?.(20)})};
window.shareAll=()=>{const t=infoText();if(navigator.share)navigator.share({text:t}).catch(()=>{});else cp(t)};
const crow=(k,v)=>`<div class="row" style="justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid #e5e7eb"><span class="muted">${k}</span><span><code style="font-size:1.1em">${esc(v)}</code> <button class="o" onclick="cp('${esc(v)}',this)">نسخ</button></span></div>`;
const V={
info(){const m=me();let h=`<div class="card" style="max-width:560px">${created?'<h2>✅ تم إنشاء المستشفى</h2><p class="muted">احتفظ بهذه البيانات وشاركها مع رئيسة التمريض. تجدها لاحقًا في «بيانات المستشفى».</p>':'<h2>بيانات المستشفى</h2>'}
 <div class="row" style="justify-content:space-between;padding:6px 0"><span class="muted">المستشفى</span><b>${esc(B.hospital?.name||'')}</b></div>`;
 if(B.hospital?.code)h+=crow('رمز المستشفى',B.hospital.code);if(m.employee_number)h+=crow('رقمك الوظيفي',m.employee_number);if(m.email)h+=crow('بريدك',m.email);
 for(const u of B.users.filter(u=>u.role==='head_nurse'&&u.id!==m.id)){h+=`<h3 style="margin-top:14px">رئيسة التمريض: ${esc(u.name)}</h3>`;if(u.employee_number)h+=crow('الرقم الوظيفي',u.employee_number);h+=u.invite_code?crow('كود التفعيل',u.invite_code):'<p style="color:#16a34a">الحساب مفعّل ✓</p>'}
 created=false;return h+`<br><button onclick="shareAll()">مشاركة الكل</button><p class="muted" style="font-size:.8em">لا تتضمن المشاركة أي كلمة مرور.</p></div>`},
dash(){const dep=B.departments.find(d=>d.id===myDept())||{};const r=roster(),d=new Date().getDate(),c=cov(r,d);const pend=B.leaves.filter(x=>x.status==='pending').length+B.swaps.filter(x=>x.status==='pending').length;
 const onLeave=B.leaves.filter(l=>l.status==='approved'&&l.start_date<=today()&&l.end_date>=today());
 return `<div class="card row"><div>${deptSel()}</div><div class="muted">${esc(B.hospital?.name)} ${B.hospital?.code?`· رمز المستشفى <code>${B.hospital.code}</code>`:''}</div></div>
 <div class="grid"><div class="card stat">بانتظار الموافقة<b>${pend}</b></div><div class="card stat">تغطية اليوم<b>D${c.D} · N${c.N}</b><span class="muted">الحد الأدنى D${dep.min_day??2} · N${dep.min_night??1}</span></div>
 <div class="card stat">في إجازة اليوم<b>${onLeave.length}</b><span class="muted">${onLeave.map(l=>esc(un(l.user_id))).join('، ')}</span></div><div class="card stat">الموظفون<b>${staff().length}</b><span class="muted">${staff().filter(u=>u.joined).length} منضم</span></div>
 <div class="card stat">حالة الجدول<b style="font-size:20px">${r?{draft:'مسودة',review:'مراجعة',approved:'معتمد'}[r.status]:'لا يوجد'}</b></div></div>
 <div class="card"><h3>إجراءات سريعة</h3><div class="row"><button onclick="go('roster')">الجدول</button><button onclick="go('req')">الموافقات</button>${isHead()?`<button onclick="go('push')">تنبيه</button><button onclick="go('staff')">إضافة موظف</button>`:''}<button onclick="go('hours')">التقارير</button></div></div>`},
roster(){const[y,m]=ym(),r=roster(),n=dim(),dep=B.departments.find(d=>d.id===myDept())||{};B._grid=JSON.parse(JSON.stringify(r?.grid||{}));
 let h=`<div class="card"><div class="row"><button class="o" onclick="month.setMonth(month.getMonth()-1);render()">→ السابق</button><div style="text-align:center"><b>${m}/${y}</b> ${deptSel()}<div class="muted">الحالة: ${r?r.status:'جديد'}</div></div><button class="o" onclick="month.setMonth(month.getMonth()+1);render()">التالي ←</button></div></div>
 <div class="card rg"><table><tr><th>الموظف</th>${Array.from({length:n},(_,i)=>`<th>${i+1}</th>`).join('')}<th>ساعات</th></tr>`;
 for(const u of staff()){h+=`<tr><td class="n">${esc(u.name)} <span class="muted">${esc(u.employee_number||'')}</span></td>`;for(let d=1;d<=n;d++){const c=B._grid[u.id]?.[d]||'';h+=`<td><button class="c c${c||'_'}" data-u="${u.id}" data-d="${d}" ${isMgr()?'':'disabled'}>${c||'·'}</button></td>`}h+=`<td id="h_${u.id}"></td></tr>`}
 h+=`<tr><td class="n muted">التغطية D/N</td>${Array.from({length:n},(_,i)=>{const c=cov({grid:B._grid},i+1),bad=c.D<(dep.min_day??2)||c.N<(dep.min_night??1);return `<td class="muted" style="${bad?'background:#fee2e2;color:#991b1b':''}">${c.D}/${c.N}</td>`}).join('')}<td></td></tr></table></div>
 <div class="card row">${isMgr()?`<button onclick="saveRoster()">حفظ</button><button class="o" onclick="saveRoster('review')">حفظ المراجعة</button><button onclick="saveRoster('approved')">اعتماد وإرسال</button><button class="o" onclick="fairFill()">تعبئة عادلة</button>`:''}<button class="o" onclick="exportRoster()">تصدير CSV</button></div>`;return h},
staff(){return `<div class="card"><h3>إضافة موظف</h3><div class="row"><input id="sn" placeholder="الاسم"><input id="st" placeholder="المسمى" value="Nurse"><input id="se" placeholder="الرقم الوظيفي" inputmode="numeric"><input id="sp" placeholder="الجوال">
 <select id="sr"><option value="employee">موظف</option><option value="supervisor">مشرف</option>${isAdmin()?'<option value="head_nurse">رئيسة تمريض</option><option value="admin">مدير</option>':''}</select>${isAdmin()?`<select id="sd">${B.departments.map(d=>`<option value="${d.id}" ${d.id===myDept()?'selected':''}>${esc(d.name)}</option>`).join('')}</select>`:''}<button onclick="addStaff()">إضافة</button></div></div>
 <div class="card"><input id="q" placeholder="بحث بالاسم أو الرقم" oninput="filterStaff(this.value)"><table id="stbl"><tr><th>الاسم</th><th>الرقم</th><th>القسم</th><th>الدور</th><th>الدعوة</th><th></th></tr>${B.users.filter(u=>isAdmin()||u.department_id===me().department_id).map(u=>`<tr data-s="${esc((u.name+' '+(u.employee_number||'')).toLowerCase())}"><td>${esc(u.name)}<div class="muted">${esc(u.title||'')}</div></td><td>${esc(u.employee_number||'')}</td><td>${esc(dn(u.department_id))}</td>
 <td>${isHead()&&u.id!==me().id&&(isAdmin()||['employee','supervisor'].includes(u.role))?`<select onchange="setRole('${u.id}',this.value)">${Object.entries(ROLE).filter(([k])=>isAdmin()||['employee','supervisor'].includes(k)).map(([k,v])=>`<option value="${k}" ${u.role===k?'selected':''}>${v}</option>`).join('')}</select>`:ROLE[u.role]}</td>
 <td>${u.joined?'<span class="pill approved">منضم</span>':u.invite_code?`<code>${u.invite_code}</code> <button class="o" onclick="navigator.clipboard.writeText('${u.invite_code}');toast('تم النسخ')">نسخ</button>`:'—'}</td>
 <td>${isHead()&&u.id!==me().id?`<button class="o" onclick="editStaff('${u.id}')">تعديل</button> <button class="r" onclick="delStaff('${u.id}')">حذف</button>`:''}</td></tr>`).join('')}</table></div>`},
req(){const row=(t,d,s,id,k)=>`<tr><td>${t}</td><td>${d}</td><td><span class="pill ${s}">${{pending:'قيد الانتظار',approved:'موافق',rejected:'مرفوض'}[s]}</span></td><td>${isMgr()&&s==='pending'?`<button onclick="decide('${k}','${id}',true)">موافقة</button> <button class="r" onclick="decide('${k}','${id}',false)">رفض</button>`:''}</td></tr>`;
 return `<div class="card"><h3>طلب إجازة</h3><div class="row"><input type="date" id="ls"><input type="date" id="le"><input id="lr" placeholder="السبب"><button onclick="reqLeave()">إرسال</button></div></div>
 <div class="card"><h3>طلب تبديل</h3><div class="row"><select id="sw">${B.users.filter(u=>u.id!==me().id&&u.department_id===me().department_id).map(u=>`<option value="${u.id}">${esc(u.name)}</option>`).join('')}</select><input type="date" id="swd"><input id="swn" placeholder="ملاحظة"><button onclick="reqSwap()">إرسال</button></div></div>
 <div class="card"><h3>الإجازات</h3><table>${B.leaves.map(l=>row(esc(un(l.user_id)),`${l.start_date} ← ${l.end_date} ${esc(l.reason||'')}`,l.status,l.id,'leaves')).join('')||'<tr><td class="muted">لا يوجد</td></tr>'}</table></div>
 <div class="card"><h3>التبديلات</h3><table>${B.swaps.map(s=>row(`${esc(un(s.from_user))} ⇄ ${esc(un(s.to_user))}`,`${s.date} ${esc(s.note||'')}`,s.status,s.id,'swaps')).join('')||'<tr><td class="muted">لا يوجد</td></tr>'}</table></div>`},
ann(){return `${isMgr()?`<div class="card"><h3>إعلان جديد</h3><input id="at" placeholder="العنوان"><br><br><textarea id="ab" rows="3" placeholder="النص"></textarea><br><br><button onclick="postAnn()">نشر وإرسال تنبيه</button></div>`:''}
 <div class="card"><h3>لوحة الإعلانات</h3>${B.announcements.map(a=>`<div style="border-bottom:1px solid var(--b);padding:8px 0"><b>${esc(a.title)}</b><div>${esc(a.body||'')}</div><div class="muted">${esc(a.author||'')} · ${new Date(a.created_at).toLocaleString('ar')}</div></div>`).join('')||'<p class="muted">لا توجد إعلانات</p>'}</div>`},
push(){return `<div class="card"><h3>تنبيه مخصص</h3><input id="pt" placeholder="العنوان"><br><br><textarea id="pb" rows="3" placeholder="النص"></textarea><label><input type="checkbox" id="pall" checked style="width:auto"> كل القسم</label>
 <div id="plist">${staff().map(u=>`<label><input type="checkbox" class="pu" value="${u.id}" style="width:auto"> ${esc(u.name)}</label>`).join('')}</div><br><button onclick="sendPush()">إرسال</button> <button class="o" onclick="act(()=>api('POST','/push/test'),r=>'اختبار: '+r.sent+'/'+r.devices)">اختبار على أجهزتي</button></div>`},
hours(){const[y,m]=ym(),pre=`${y}-${String(m).padStart(2,'0')}`;const r=roster();const rows=staff().map(u=>{const sh=Object.values(r?.grid?.[u.id]||{}).filter(c=>c==='D'||c==='N').length;const lg=B.attendance.filter(a=>a.user_id===u.id&&a.date.startsWith(pre)).reduce((s,a)=>s+a.hours,0);return{u,sh:sh*12,lg}});B._hrows=rows;
 return `<div class="card row"><button class="o" onclick="month.setMonth(month.getMonth()-1);render()">→</button><b style="text-align:center">${m}/${y}</b><button class="o" onclick="month.setMonth(month.getMonth()+1);render()">←</button>${deptSel()}</div>
 <div class="card"><h3>تسجيل ساعات</h3><div class="row"><select id="hu">${staff().map(u=>`<option value="${u.id}">${esc(u.name)}</option>`).join('')}</select><input type="date" id="hd" value="${today()}"><select id="hk"><option value="H">حضور فعلي</option><option value="OT">إضافي</option><option value="SB">استعداد</option><option value="CT">تعويضي</option><option value="LV">إجازة</option><option value="CR">دورة</option></select><input id="hh" type="number" value="12" step="0.5"><button onclick="addHours()">إضافة</button></div></div>
 <div class="card"><canvas id="ch" height="120"></canvas></div><div class="card"><canvas id="cc" height="90"></canvas></div>
 <div class="card"><table><tr><th>الموظف</th><th>ساعات الجدول</th><th>المسجلة</th></tr>${rows.map(x=>`<tr><td>${esc(x.u.name)}</td><td>${x.sh}</td><td>${x.lg}</td></tr>`).join('')}</table><br><button class="o" onclick="exportHours()">تصدير CSV</button> <button class="o" onclick="window.print()">طباعة / PDF</button></div>`},
events(){return `${isMgr()?`<div class="card"><h3>دورة / فعالية</h3><div class="row"><input id="et" placeholder="العنوان"><input id="ed" type="datetime-local"><input id="el" placeholder="المكان"><input id="ea" placeholder="الفئة"><button onclick="addEvent()">إضافة</button></div></div>`:''}
 <div class="card"><table>${B.events.map(e=>`<tr><td><b>${esc(e.title)}</b></td><td>${new Date(e.date).toLocaleString('ar')}</td><td>${esc(e.location||'')}</td><td>${esc(e.audience||'')}</td><td>${isMgr()?`<button class="r" onclick="act(()=>api('DELETE','/events/${e.id}'),'حُذف')">حذف</button>`:''}</td></tr>`).join('')||'<tr><td class="muted">لا يوجد</td></tr>'}</table></div>`},
cov(){const d=B.departments.find(x=>x.id===myDept())||{};return `<div class="card"><h3>الحد الأدنى للتغطية — ${deptSel()}</h3><div class="row"><div><label>نهاري ≥</label><input id="mnd" type="number" value="${d.min_day??2}"></div><div><label>ليلي ≥</label><input id="mnn" type="number" value="${d.min_night??1}"></div><button onclick="act(()=>api('PATCH','/departments/${myDept()}',{min_day:+$('#mnd').value,min_night:+$('#mnn').value}),'تم الحفظ')">حفظ</button></div></div>`},
depts(){return `<div class="card"><h3>الأقسام</h3><div class="row"><input id="dn" placeholder="قسم جديد"><button onclick="act(()=>api('POST','/departments',{name:$('#dn').value}),'أُضيف')">إضافة</button></div><table>${B.departments.map(d=>`<tr><td>${esc(d.name)}</td><td>${B.users.filter(u=>u.department_id===d.id).length} موظف</td><td><button class="r" onclick="confirm('حذف القسم؟')&&act(()=>api('DELETE','/departments/${d.id}'),'حُذف')">حذف</button></td></tr>`).join('')}</table></div>`},
audit(){return `<div class="card"><h3>سجل التدقيق</h3><table><tr><th>الوقت</th><th>المستخدم</th><th>الإجراء</th><th>التفاصيل</th></tr>${(B.audit_log||[]).map(a=>`<tr><td class="muted">${new Date(a.created_at).toLocaleString('ar')}</td><td>${esc(a.user_name)}</td><td>${esc(a.action)}</td><td class="muted">${esc(a.detail)}</td></tr>`).join('')}</table></div>`},
notif(){return `<div class="card"><h3>سجل التنبيهات (لي)</h3><table>${B.notifications.map(n=>`<tr><td>${esc(n.title)}</td><td>${esc(n.body||'')}</td><td class="muted">${esc(n.result)}</td><td class="muted">${new Date(n.created_at).toLocaleString('ar')}</td></tr>`).join('')||'<tr><td class="muted">لا يوجد</td></tr>'}</table></div>`},
super(){return `<div class="card"><h3>كل المستشفيات (${B.super.length})</h3><table><tr><th>المستشفى</th><th>الرمز</th><th>الأقسام</th><th>الموظفون</th><th>الأجهزة</th><th>الإنشاء</th></tr>${B.super.map(h=>`<tr><td>${esc(h.name)}</td><td><code>${esc(h.code)}</code></td><td>${h.departments}</td><td>${h.users}</td><td>${h.devices}</td><td class="muted">${new Date(h.created_at).toLocaleDateString('ar')}</td></tr>`).join('')}</table><p class="muted">لإنشاء مستشفى جديد: سجّل خروج ← «تسجيل مستشفى».</p></div>`}
};
const A={roster(){document.querySelectorAll('button.c').forEach(b=>b.onclick=()=>{const o=['D','N','R','L','C',''],u=b.dataset.u,d=b.dataset.d;B._grid[u]??={};const c=B._grid[u][d]||'';const nx=o[(o.indexOf(c)+1)%o.length];if(nx)B._grid[u][d]=nx;else delete B._grid[u][d];b.className='c c'+(nx||'_');b.textContent=nx||'·';hrs()});hrs()},
hours(){const r=B._hrows;new Chart($('#ch'),{type:'bar',data:{labels:r.map(x=>x.u.name),datasets:[{label:'ساعات الجدول',data:r.map(x=>x.sh),backgroundColor:'#13827a'},{label:'المسجلة',data:r.map(x=>x.lg),backgroundColor:'#7c3aed'}]},options:{indexAxis:'y'}});
 const ro=roster(),n=dim(),ds=Array.from({length:n},(_,i)=>cov(ro,i+1));new Chart($('#cc'),{type:'line',data:{labels:ds.map((_,i)=>i+1),datasets:[{label:'نهاري',data:ds.map(x=>x.D),borderColor:'#2563eb'},{label:'ليلي',data:ds.map(x=>x.N),borderColor:'#7c3aed'}]}})}};
function hrs(){for(const u of staff()){const e=$('#h_'+u.id);if(e)e.textContent=Object.values(B._grid[u.id]||{}).filter(c=>c==='D'||c==='N').length*12}}
window.saveRoster=async st=>{const[y,m]=ym();await act(async()=>{const r=await api('PUT','/rosters',{department_id:myDept(),year:y,month:m,grid:B._grid});if(st)return api('POST',`/rosters/${r.id}/status`,{status:st});return r},r=>r.push?`تم — أُرسل ${r.push.filter(x=>x.status===200).length} تنبيه`:'تم الحفظ')};
window.fairFill=()=>{const dep=B.departments.find(d=>d.id===myDept())||{},minD=dep.min_day??2,minN=dep.min_night??1,[y,m]=ym(),n=dim(),S=staff().map(u=>u.id),tot={},ni={},wk={},last={};
 for(let d=1;d<=n;d++){const w=[5,6].includes(new Date(y,m-1,d).getDay());let free=S.filter(u=>!['L','C'].includes(B._grid[u]?.[d]));
  const pick=(k,night)=>{const c=free.filter(u=>night||last[u]!=='N').sort((a,b)=>((tot[a]||0)-(tot[b]||0))||(night?(ni[a]||0)-(ni[b]||0):0)||(w?(wk[a]||0)-(wk[b]||0):0)).slice(0,k);free=free.filter(u=>!c.includes(u));return c};
  const N=pick(minN,true),D=pick(minD,false);for(const u of S){B._grid[u]??={};const cur=B._grid[u][d];const c=N.includes(u)?'N':D.includes(u)?'D':(['L','C'].includes(cur)?cur:'R');B._grid[u][d]=c;if(c==='D'||c==='N'){tot[u]=(tot[u]||0)+1;if(w)wk[u]=(wk[u]||0)+1}if(c==='N')ni[u]=(ni[u]||0)+1;last[u]=c}}
 const g=B._grid;const[yy,mm]=ym();const r=roster();if(r)r.grid=g;else B.rosters.push({department_id:myDept(),year:yy,month:mm,status:'draft',grid:g});$('#app').innerHTML=V.roster();B._grid=g;A.roster();toast('تمت التعبئة — اضغط حفظ')};
const csv=(rows,name)=>{const b=new Blob(['\ufeff'+rows.map(r=>r.map(c=>`"${String(c).replace(/"/g,'""')}"`).join(',')).join('\n')],{type:'text/csv'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;a.click()};
window.exportRoster=()=>{const[y,m]=ym(),n=dim();csv([['الموظف','الرقم',...Array.from({length:n},(_,i)=>i+1)],...staff().map(u=>[u.name,u.employee_number||'',...Array.from({length:n},(_,i)=>B._grid[u.id]?.[i+1]||'')])],`roster-${y}-${m}.csv`)};
window.exportHours=()=>{const[y,m]=ym();csv([['الموظف','ساعات الجدول','المسجلة'],...B._hrows.map(x=>[x.u.name,x.sh,x.lg])],`hours-${y}-${m}.csv`)};
window.addStaff=()=>act(()=>api('POST','/employees',{name:$('#sn').value,title:$('#st').value,employee_number:$('#se').value.trim(),phone:$('#sp').value,role:$('#sr').value,department_id:$('#sd')?.value||myDept()}),r=>'رمز الدعوة: '+r.invite_code);
window.setRole=(id,r)=>act(()=>api('POST',`/employees/${id}/role`,{role:r}),'تم تغيير الصلاحية');
window.delStaff=id=>confirm('حذف الموظف؟')&&act(()=>api('DELETE','/employees/'+id),'حُذف');
window.editStaff=id=>{const u=B.users.find(x=>x.id===id);const n=prompt('الاسم',u.name);if(n===null)return;const e=prompt('الرقم الوظيفي',u.employee_number||'');if(e===null)return;const t=prompt('المسمى',u.title||'');act(()=>api('PATCH','/employees/'+id,{name:n,employee_number:e,title:t??u.title}),'تم التعديل')};
window.filterStaff=q=>document.querySelectorAll('#stbl tr[data-s]').forEach(r=>r.style.display=r.dataset.s.includes(q.toLowerCase())?'':'none');
window.decide=(k,id,ok)=>act(()=>api('POST',`/${k}/${id}/decision`,{approve:ok}),ok?'تمت الموافقة':'تم الرفض');
window.reqLeave=()=>act(()=>api('POST','/leaves',{start_date:$('#ls').value,end_date:$('#le').value,reason:$('#lr').value}),'أُرسل الطلب');
window.reqSwap=()=>act(()=>api('POST','/swaps',{to_user:$('#sw').value,date:$('#swd').value,note:$('#swn').value}),'أُرسل الطلب');
window.postAnn=()=>act(()=>api('POST','/announcements',{title:$('#at').value,body:$('#ab').value,department_id:isAdmin()?null:me().department_id}),'نُشر الإعلان');
window.sendPush=()=>{const ids=$('#pall').checked?[]:[...document.querySelectorAll('.pu:checked')].map(x=>x.value);act(()=>api('POST','/push/custom',{title:$('#pt').value,body:$('#pb').value,user_ids:ids,department_id:myDept()}),r=>`أُرسل إلى ${r.recipients} موظف (${r.sent}/${r.devices} جهاز)`)};
window.addHours=()=>act(()=>api('POST','/attendance',{user_id:$('#hu').value,date:$('#hd').value,kind:$('#hk').value,hours:+$('#hh').value}),'سُجّلت');
window.addEvent=()=>act(()=>api('POST','/events',{title:$('#et').value,date:new Date($('#ed').value).toISOString(),location:$('#el').value,audience:$('#ea').value}),'أُضيفت');
render();
</script></body></html>
