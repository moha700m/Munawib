name: Screenshots
on:
  workflow_dispatch:
    inputs:
      set: { description: "store or review", default: store }
jobs:
  shots:
    strategy:
      matrix:
        device: [iphone, ipad]
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - run: brew install xcodegen && xcodegen generate
      - name: Pick 6.9" simulator
        run: |
          xcrun simctl list devices available
          UDID=$(xcrun simctl list devices available -j | python3 -c "
          import json,sys
          d=json.load(sys.stdin)['devices']
          prefs={'iphone':['iPhone 17 Pro Max','iPhone 16 Pro Max','iPhone 16 Plus'],'ipad':['iPad Pro 13-inch (M5)','iPad Pro 13-inch (M4)','iPad Air 13-inch (M3)','iPad Air 13-inch (M2)']}['${{ matrix.device }}']
          for pref in prefs:
              for rt,devs in sorted(d.items(), reverse=True):
                  for x in devs:
                      if x['name']==pref and 'iOS' in rt: print(x['udid']); sys.exit()
          ")
          echo "UDID=$UDID" >> $GITHUB_ENV; echo "using $UDID"
      - name: Build for simulator
        run: |
          set -o pipefail
          xcodebuild -project Munawib.xcodeproj -scheme Munawib -configuration Debug -destination "id=$UDID" -derivedDataPath build CODE_SIGNING_ALLOWED=NO build | tail -30
      - name: Capture
        run: |
          set -x
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl status_bar "$UDID" override --time "9:41" --batteryState charged --batteryLevel 100 --cellularBars 4 --wifiBars 3 || true
          xcrun simctl ui "$UDID" appearance light || true
          xcrun simctl install "$UDID" build/Build/Products/Debug-iphonesimulator/Munawib.app
          mkdir -p shots
          shoot() { name=$1; shift; xcrun simctl terminate "$UDID" com.mohlab.munawib || true
            xcrun simctl launch "$UDID" com.mohlab.munawib "$@" -AppleLanguages "(ar)" -AppleLocale ar_SA; sleep ${WAIT:-6}
            xcrun simctl io "$UDID" screenshot "shots/$name.png"; }
          SET="${{ github.event.inputs.set || 'store' }}"
          if [ "$SET" = "review" ]; then
            shoot a01_login -auth login
            shoot a02_login_number -auth loginNumber
            shoot a03_login_error -auth error
            shoot a04_signup_step1 -auth signup
            shoot a05_signup_step2 -auth signup2
            WAIT=8 shoot a06_keyboard_numeric -auth keyboard
            shoot a07_activate -auth activate
            shoot a08_hospital_created -auth created
            shoot a09_settings_hospital -demo -hospitalInfo -screen settings
            shoot a10_home -demo -screen home
            shoot a11_roster -demo -screen roster
            shoot a12_dashboard -demo -screen dashboard
            shoot a13_myshifts -demo -screen myShifts
            xcrun simctl ui "$UDID" appearance dark
            shoot a14_home_dark -demo -screen home
            shoot a15_login_dark -auth login
          else
            shoot 01_dashboard -demo -screen dashboard
            shoot 02_roster -demo -screen roster
            shoot 03_myShifts -demo -screen myShifts
            shoot 04_reports -demo -screen reports
            shoot 05_alerts -demo -screen alerts
          fi
          sips -g pixelWidth -g pixelHeight shots/*.png
      - uses: actions/upload-artifact@v4
        with:
          name: screenshots-${{ matrix.device }}
          path: shots/
