# Uploads the SAME codebase as a separate App Store app:
#   bundle ID  com.mohlab.manawib
#   ASC Apple ID 6832669893
# Does not change the existing Munawib (com.mohlab.munawib) pipeline.
name: TestFlight Manawib (public)
on:
  workflow_dispatch:
jobs:
  testflight:
    runs-on: macos-26
    timeout-minutes: 50
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      TEAM_ID: ${{ secrets.TEAM_ID }}
      BUNDLE_ID: com.mohlab.manawib
      MARKETING_VERSION: "1.0"
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - run: brew install xcodegen && xcodegen generate
      - name: Point Info.plist at manawib bundle + iPhone-only
        run: |
          # CFBundleURLName is hardcoded to com.mohlab.munawib in source; patch
          # only this checkout so the manawib build claims its own URL type.
          # URL scheme kept as munawib (deep-link compatibility); no extensions
          # or app groups exist to remap.
          /usr/libexec/PlistBuddy -c "Set :CFBundleURLTypes:0:CFBundleURLName $BUNDLE_ID" Munawib/Info.plist
          # Drop iPad orientations so ASC treats this as iPhone-only (no iPad
          # 13" screenshot requirement). Old munawib workflow is unaffected.
          /usr/libexec/PlistBuddy -c "Delete :UISupportedInterfaceOrientations~ipad" Munawib/Info.plist || true
          /usr/libexec/PlistBuddy -c "Print :CFBundleURLTypes" Munawib/Info.plist
          /usr/libexec/PlistBuddy -c "Print" Munawib/Info.plist | grep -i orientation || true
      - name: Install API key
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          KEY=~/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8
          printf '%s\n' "$ASC_KEY_P8" > "$KEY"
          echo "KEY_PATH=$KEY" >> $GITHUB_ENV
      - name: Archive (unsigned) as com.mohlab.manawib (iPhone-only)
        run: |
          set -o pipefail
          xcodebuild archive -project Munawib.xcodeproj -scheme Munawib -configuration Release \
            -destination 'generic/platform=iOS' -archivePath build/Munawib.xcarchive \
            DEVELOPMENT_TEAM=$TEAM_ID \
            PRODUCT_BUNDLE_IDENTIFIER=$BUNDLE_ID \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            MARKETING_VERSION=$MARKETING_VERSION \
            TARGETED_DEVICE_FAMILY=1 \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" | tee /tmp/archive.log | tail -100
      - name: Verify embedded bundle id + iPhone-only
        run: |
          APP=build/Munawib.xcarchive/Products/Applications/Munawib.app
          BID=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist")
          VER=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Info.plist")
          BLD=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP/Info.plist")
          FAMILY=$(/usr/libexec/PlistBuddy -c 'Print :UIDeviceFamily' "$APP/Info.plist" 2>/dev/null || true)
          echo "bundled id=$BID version=$VER build=$BLD UIDeviceFamily=$FAMILY"
          test "$BID" = "$BUNDLE_ID"
          test "$VER" = "$MARKETING_VERSION"
          # UIDeviceFamily should be only iPhone (1), not [1, 2]
          echo "$FAMILY" | grep -q 'Array'
          echo "$FAMILY" | grep -q '1'
          if echo "$FAMILY" | grep -q '2'; then
            echo "ERROR: still includes iPad (device family 2)" >&2
            exit 1
          fi
          if /usr/libexec/PlistBuddy -c 'Print :UISupportedInterfaceOrientations~ipad' "$APP/Info.plist" >/dev/null 2>&1; then
            echo "ERROR: iPad orientations still present" >&2
            exit 1
          fi
      - name: Embed entitlements (aps-environment) for cloud signing
        run: |
          APP=build/Munawib.xcarchive/Products/Applications/Munawib.app
          codesign --force --sign - --entitlements Munawib/Munawib.entitlements --timestamp=none "$APP"
          codesign -d --entitlements - "$APP"
      - name: Export (cloud sign) and upload to App Store Connect
        run: |
          set -o pipefail
          cat > ExportOptions.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
          <key>method</key><string>app-store-connect</string>
          <key>destination</key><string>upload</string>
          <key>teamID</key><string>$TEAM_ID</string>
          <key>signingStyle</key><string>automatic</string>
          <key>uploadSymbols</key><true/>
          <key>manageAppVersionAndBuildNumber</key><false/>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive -archivePath build/Munawib.xcarchive -exportPath build/export \
            -exportOptionsPlist ExportOptions.plist -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY_PATH" -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" 2>&1 | tee /tmp/export.log | tail -150
      - if: always()
        run: rm -rf ~/.appstoreconnect
