name: Munawib
options:
  bundleIdPrefix: com.mohlab
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: ""
targets:
  Munawib:
    type: application
    platform: iOS
    sources: [Munawib]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mohlab.munawib
        PRODUCT_NAME: Munawib
        INFOPLIST_FILE: Munawib/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        MARKETING_VERSION: "2.2"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGN_ENTITLEMENTS: Munawib/Munawib.entitlements
