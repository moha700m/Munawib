name: Munawib
options:
  bundleIdPrefix: com.mohlab
  developmentLanguage: ar
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: ""
targets:
  Munawib:
    type: application
    platform: iOS
    sources: [Munawib]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mohlab.munawib
        PRODUCT_NAME: Munawib
        INFOPLIST_FILE: Munawib/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        MARKETING_VERSION: "2.2"
        CURRENT_PROJECT_VERSION: "20"
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGN_ENTITLEMENTS: Munawib/Munawib.entitlements
  MunawibUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [MunawibUITests]
    dependencies:
      - target: Munawib
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mohlab.munawib.uitests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGNING_ALLOWED: NO
        TEST_TARGET_NAME: Munawib
schemes:
  Munawib:
    build:
      targets:
        Munawib: all
    test:
      targets:
        - MunawibUITests
